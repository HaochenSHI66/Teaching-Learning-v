[project]
name = "ppt-learning-backend"
version = "0.1.0"
description = "Backend for PPT split-screen learning assistant"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116.0",
  "uvicorn[standard]>=0.35.0",
  "sqlmodel>=0.0.24",
  "python-multipart>=0.0.20",
  "python-dotenv>=1.2.0",
  "httpx>=0.28.0",
  "pillow>=11.3.0",
  "pymupdf>=1.26.0",
  "bcrypt>=4.0.0",
  "pyjwt>=2.8.0",
  "jinja2>=3.1.0",
  "weasyprint>=62.0"
]

[project.optional-dependencies]
postgres = [
  "psycopg2-binary>=2.9.0"
]
dev = [
  "pytest>=9.0.0",
  "httpx>=0.28.0"
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
