[project]
name = "ppt-learning-backend"
version = "0.1.0"
description = "Backend for PPT split-screen learning assistant"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116.0",
  "uvicorn[standard]>=0.35.0",
  "sqlmodel>=0.0.24",
  "python-multipart>=0.0.20",
  "pillow>=11.3.0",
  "pymupdf>=1.26.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.0",
  "httpx>=0.28.0"
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["."]
