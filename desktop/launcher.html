<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>幻灯片研习台</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  @font-face {
    font-family: 'System';
    src: local('.AppleSystemUIFont'), local('PingFang SC'), local('Microsoft YaHei'), local('sans-serif');
  }

  body {
    font-family: 'System', -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(circle at 18% 18%, rgba(111, 140, 104, 0.08), transparent 22%),
      radial-gradient(circle at 82% 14%, rgba(214, 164, 91, 0.1), transparent 24%),
      radial-gradient(circle at 76% 78%, rgba(201, 123, 92, 0.06), transparent 18%),
      linear-gradient(180deg, #f7f0e5 0%, #efe4d1 48%, #eadcc6 100%);
    color: #3a2c1c;
  }

  .window {
    width: 480px;
    height: 380px;
    background: rgba(255, 253, 248, 0.88);
    backdrop-filter: blur(40px) saturate(1.8);
    -webkit-backdrop-filter: blur(40px) saturate(1.8);
    border-radius: 24px;
    border: 1px solid rgba(217, 199, 171, 0.4);
    box-shadow:
      0 24px 64px rgba(58, 44, 28, 0.12),
      0 2px 8px rgba(58, 44, 28, 0.06),
      inset 0 1px 0 rgba(255, 255, 255, 0.6);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
  }

  /* Header */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 24px;
    height: 60px;
    border-bottom: 1px solid rgba(217, 199, 171, 0.3);
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .app-icon {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    object-fit: contain;
  }

  .header-title {
    display: flex;
    flex-direction: column;
  }

  .header-title h1 {
    font-size: 16px;
    font-weight: 700;
    color: #3a2c1c;
    letter-spacing: -0.02em;
    line-height: 1.2;
  }

  .header-title .subtitle {
    font-size: 10px;
    font-weight: 500;
    color: #8c765f;
    text-transform: uppercase;
    letter-spacing: 0.2em;
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .icon-btn {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    border: none;
    background: transparent;
    color: #7a6248;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    transition: background 0.15s;
  }

  .icon-btn:hover {
    background: rgba(232, 216, 192, 0.5);
  }

  /* Main Content */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    gap: 20px;
  }

  .icon-area {
    position: relative;
  }

  .icon-backdrop {
    width: 88px;
    height: 88px;
    border-radius: 22px;
    background: linear-gradient(135deg, #f5ebda, #ede3d3);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: inset 0 2px 4px rgba(58, 44, 28, 0.06);
  }

  .icon-backdrop img {
    width: 60px;
    height: 60px;
    object-fit: contain;
  }

  .status-dots {
    position: absolute;
    top: -4px;
    right: -4px;
    display: flex;
    gap: 5px;
    padding: 6px 8px;
    background: rgba(255, 253, 248, 0.95);
    border-radius: 20px;
    box-shadow: 0 2px 8px rgba(58, 44, 28, 0.08);
  }

  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    transition: background 0.3s;
  }

  .dot.stopped { background: #b09a80; }
  .dot.starting { background: #d6a45b; animation: dot-pulse 1.8s ease-in-out infinite; }
  .dot.running { background: #6f8c68; box-shadow: 0 0 6px rgba(111, 140, 104, 0.4); }
  .dot.error { background: #c97b5c; }

  @keyframes dot-pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(1.15); }
  }

  .status-text {
    text-align: center;
  }

  .status-text h2 {
    font-size: 17px;
    font-weight: 600;
    color: #3a2c1c;
    margin-bottom: 4px;
  }

  .status-text p {
    font-size: 12px;
    color: #8c765f;
    font-weight: 500;
  }

  /* Service Cards */
  .services {
    width: 100%;
    background: rgba(251, 246, 237, 0.7);
    border-radius: 14px;
    border: 1px solid rgba(217, 199, 171, 0.3);
    overflow: hidden;
  }

  .service-row {
    display: flex;
    align-items: center;
    padding: 10px 16px;
    gap: 10px;
  }

  .service-row + .service-row {
    border-top: 1px solid rgba(236, 222, 200, 0.6);
  }

  .service-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .service-label {
    font-size: 13px;
    font-weight: 500;
    color: #463829;
    flex: 1;
  }

  .service-port {
    font-size: 11px;
    color: #b09a80;
    font-variant-numeric: tabular-nums;
  }

  .service-status {
    font-size: 11px;
    font-weight: 500;
    padding: 2px 8px;
    border-radius: 6px;
  }

  .service-status.starting {
    color: #7a5a20;
    background: rgba(214, 164, 91, 0.15);
  }

  .service-status.running {
    color: #3d6638;
    background: rgba(111, 140, 104, 0.12);
  }

  .service-status.stopped {
    color: #7a6248;
    background: rgba(176, 154, 128, 0.12);
  }

  .service-status.error {
    color: #8a4030;
    background: rgba(201, 123, 92, 0.12);
  }

  /* Footer */
  .footer {
    padding: 16px 24px 20px;
  }

  .action-btn {
    width: 100%;
    height: 44px;
    border-radius: 12px;
    border: none;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: all 0.2s;
    letter-spacing: 0.01em;
  }

  .action-btn.start {
    background: linear-gradient(135deg, #6f8c68, #7f8763);
    color: #faf7ef;
    box-shadow: 0 4px 12px rgba(111, 140, 104, 0.25);
  }

  .action-btn.start:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 16px rgba(111, 140, 104, 0.35);
  }

  .action-btn.open {
    background: linear-gradient(135deg, #d6a45b, #c97b5c);
    color: #fff8ef;
    box-shadow: 0 4px 12px rgba(214, 164, 91, 0.25);
  }

  .action-btn.open:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 16px rgba(214, 164, 91, 0.35);
  }

  .action-btn.loading {
    background: rgba(237, 227, 211, 0.6);
    color: rgba(122, 98, 72, 0.4);
    cursor: not-allowed;
    box-shadow: none;
  }

  .action-btn .spinner {
    width: 16px;
    height: 16px;
    border: 2px solid rgba(122, 98, 72, 0.2);
    border-top-color: rgba(122, 98, 72, 0.5);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .progress-bar {
    width: 100%;
    height: 3px;
    background: rgba(236, 222, 200, 0.6);
    border-radius: 2px;
    margin-top: 12px;
    overflow: hidden;
    position: relative;
  }

  .progress-bar::after {
    content: "";
    position: absolute;
    top: 0; left: -30%; bottom: 0;
    width: 30%;
    background: linear-gradient(90deg, #d6a45b, #6f8c68);
    border-radius: 2px;
    animation: slide 1.4s ease-in-out infinite;
  }

  @keyframes slide {
    0% { left: -30%; }
    100% { left: 100%; }
  }

  .footer-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 12px;
    padding: 0 2px;
  }

  .footer-meta span {
    font-size: 10px;
    color: #b09a80;
    font-weight: 500;
    letter-spacing: 0.03em;
  }

  .footer-meta a {
    font-size: 10px;
    color: #8c765f;
    text-decoration: none;
    cursor: pointer;
    transition: color 0.15s;
  }

  .footer-meta a:hover {
    color: #463829;
  }

  .hint {
    text-align: center;
    font-size: 10px;
    color: #b09a80;
    margin-top: 8px;
  }

  /* State: hide/show */
  .hidden { display: none !important; }
</style>
</head>

        <div class="service-dot stopped" id="svc-dot-frontend"></div>
        <span class="service-label">前端服务</span>
        <span class="service-port">:3000</span>
        <span class="service-status stopped" id="svc-status-frontend">等待中</span>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <div class="footer">
    <button class="action-btn loading" id="action-btn" disabled>
      <div class="spinner"></div>
      <span>正在启动...</span>
    </button>
    <div class="progress-bar" id="progress-bar"></div>
    <div class="footer-meta">
      <span>v1.0.0</span>
      <span>
        <a onclick="openHelp()">帮助</a>
      </span>
    </div>
  </div>
</div>

<script>
// Service launcher state machine
const State = { STOPPED: 0, STARTING: 1, RUNNING: 2, ERROR: 3 };
let backendState = State.STOPPED;
let frontendState = State.STOPPED;

const stateClass = { [State.STOPPED]: 'stopped', [State.STARTING]: 'starting', [State.RUNNING]: 'running', [State.ERROR]: 'error' };
const stateLabel = { [State.STOPPED]: '已停止', [State.STARTING]: '启动中', [State.RUNNING]: '就绪', [State.ERROR]: '异常' };

function updateUI() {
  // Dots
  for (const [id, state] of [['dot-backend', backendState], ['dot-frontend', frontendState],
                              ['svc-dot-backend', backendState], ['svc-dot-frontend', frontendState]]) {
    const el = document.getElementById(id);
    el.className = 'dot ' + stateClass[state];
    if (id.startsWith('svc-dot')) el.className = 'service-dot ' + stateClass[state];
  }
  // Status badges
  for (const [id, state] of [['svc-status-backend', backendState], ['svc-status-frontend', frontendState]]) {
    const el = document.getElementById(id);
    el.className = 'service-status ' + stateClass[state];
    el.textContent = stateLabel[state];
  }
  // Title & button
  const btn = document.getElementById('action-btn');
  const progress = document.getElementById('progress-bar');
  const title = document.getElementById('status-title');
  const detail = document.getElementById('status-detail');

  if (backendState === State.RUNNING && frontendState === State.RUNNING) {
    title.textContent = '服务已就绪';
    detail.textContent = '点击下方按钮打开应用';
    btn.className = 'action-btn open';
    btn.innerHTML = '打开应用';
    btn.disabled = false;
    btn.onclick = () => { window.location.href = 'http://127.0.0.1:3000'; };
    progress.style.display = 'none';
  } else if (backendState === State.ERROR || frontendState === State.ERROR) {
    title.textContent = '启动失败';
    detail.textContent = '请检查配置或重试';
    btn.className = 'action-btn start';
    btn.innerHTML = '重试';
    btn.disabled = false;
    btn.onclick = startServices;
    progress.style.display = 'none';
  } else {
    title.textContent = '正在启动服务...';
    detail.textContent = backendState === State.STARTING ? '初始化后端环境' : '启动前端界面';
    btn.className = 'action-btn loading';
    btn.innerHTML = '<div class="spinner"></div><span>正在启动...</span>';
    btn.disabled = true;
    progress.style.display = '';
  }
}

async function checkHealth(url, timeout = 3000) {
  try {
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), timeout);
    const r = await fetch(url, { signal: ctrl.signal });
    clearTimeout(t);
    return r.ok;
  } catch { return false; }
}

async function startServices() {
  backendState = State.STARTING;
  frontendState = State.STOPPED;
  updateUI();

  // Poll backend
  for (let i = 0; i < 30; i++) {
    if (await checkHealth('http://127.0.0.1:8000/health')) {
      backendState = State.RUNNING;
      frontendState = State.STARTING;
      updateUI();
      break;
    }
    await new Promise(r => setTimeout(r, 1000));
  }
  if (backendState !== State.RUNNING) {
    backendState = State.ERROR;
    updateUI();
    return;
  }

  // Poll frontend
  for (let i = 0; i < 30; i++) {
    if (await checkHealth('http://127.0.0.1:3000')) {
      frontendState = State.RUNNING;
      updateUI();
      return;
    }
    await new Promise(r => setTimeout(r, 1000));
  }
  frontendState = State.ERROR;
  updateUI();
}

function openSettings() { /* native hook */ }
function openHelp() { /* native hook */ }

// Auto-start on load
startServices();
</script>

</body>
</html>
